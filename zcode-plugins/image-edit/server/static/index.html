<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>改图 · 生图 · 视频</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1e232d;
      --line: #2a3140;
      --text: #e8eaed;
      --muted: #9aa3b2;
      --accent: #e11d48;
      --accent-2: #38bdf8;
      --ok: #34d399;
      --warn: #fbbf24;
      --danger: #fb7185;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; height: 100%; }
    .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
    .tabs, .toolbar, .side { background: var(--panel); }
    .tabs { display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .tab {
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
      padding: 7px 16px; color: var(--muted); font-weight: 600;
    }
    .tab:hover { border-color: #3d4658; color: var(--text); }
    .tab.active { background: #9f1239; border-color: #be123c; color: #fff; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    .toolbar .group { display: flex; gap: 6px; align-items: center; padding-right: 10px; border-right: 1px solid var(--line); }
    .toolbar .group:last-child { border-right: 0; }
    .btn {
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
      padding: 6px 10px; color: var(--text);
    }
    .btn:hover { border-color: #3d4658; }
    .btn.active { background: #2a1520; border-color: var(--accent); color: #fecdd3; }
    .btn.primary { background: #9f1239; border-color: #be123c; }
    .btn.primary:hover { background: #be123c; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .hint { color: var(--muted); font-size: 12px; }
    .canvas-wrap {
      flex: 1; min-height: 0; display: flex; position: relative; overflow: auto;
      background:
        linear-gradient(45deg, #151922 25%, transparent 25%) 0 0 / 20px 20px,
        linear-gradient(-45deg, #151922 25%, transparent 25%) 0 10px / 20px 20px,
        #0c0e13;
    }
    .stack { margin: auto; position: relative; }
    .stack canvas { display: block; max-width: none; }
    #view { position: absolute; inset: 0; }
    #paint { position: absolute; inset: 0; cursor: crosshair; }
    .canvas-wrap.dragging::after {
      content: "松手把图片放进画布";
      position: absolute; inset: 12px; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      border: 2px dashed var(--accent-2); border-radius: 12px;
      color: var(--accent-2); font-size: 15px; background: #0c0e13cc;
      pointer-events: none;
    }
    .stage-banner { margin: auto; text-align: center; color: var(--muted); padding: 40px; }
    .stage-banner .big { font-size: 18px; color: var(--text); margin-bottom: 8px; }
    .side { padding: 12px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
    h1 { font-size: 16px; margin: 0 0 4px; font-weight: 650; }
    h2 { font-size: 12px; margin: 0 0 8px; color: var(--muted); font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
    .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
    input[type=text], input[type=password], input[type=number], select, textarea {
      width: 100%; background: #12151c; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px;
    }
    textarea { min-height: 92px; resize: vertical; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { flex: 1; }
    .thumbs { display: flex; flex-wrap: wrap; gap: 8px; }
    .thumb {
      width: 72px; height: 72px; border-radius: 8px; overflow: hidden; border: 2px solid transparent;
      position: relative; background: #0c0e13;
    }
    .thumb.active { border-color: var(--accent-2); }
    .thumb img, .thumb canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb .x {
      position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; border: 0; border-radius: 50%;
      background: #000a; color: #fff; font-size: 12px; padding: 0; line-height: 18px;
    }
    .status { font-size: 12px; color: var(--muted); min-height: 1.4em; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--danger); }
    .result img { width: 100%; border-radius: 8px; background: #000; }
    .gallery { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .gallery .gitem {
      width: 84px; height: 84px; border-radius: 8px; overflow: hidden; border: 2px solid transparent;
      background: #0c0e13; padding: 0;
    }
    .gallery .gitem.active { border-color: var(--accent-2); }
    .gallery .gitem img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .result video { width: 100%; border-radius: 8px; background: #000; }
    .price { font-size: 12px; color: var(--warn); margin-top: 8px; min-height: 1.3em; }
    .brush { width: 110px; }
    .key-wrap { position: relative; }
    .key-wrap button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); padding: 2px 6px; font-size: 12px; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    #outImg { cursor: zoom-in; }
    /* fullscreen viewer */
    .viewer { position: fixed; inset: 0; z-index: 100; background: rgba(6,8,12,.94); display: none; flex-direction: column; }
    .viewer.open { display: flex; }
    .viewer-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #0e1016cc; }
    .viewer-top .vinfo { flex: 1; font-size: 13px; color: var(--muted); }
    .viewer-body { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .viewer-body img { max-width: 96%; max-height: 92%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
    .viewer-body.single #imgB, .viewer-body.single .vdivider { display: none; }
    .viewer-body.side { gap: 8px; }
    .viewer-body.side #imgA, .viewer-body.side #imgB { max-width: 49%; max-height: 92%; }
    .viewer-body.side .vlabel, .viewer-body.swipe .vlabel, .viewer-body.hold .vlabel { display: block; }
    .viewer-body.swipe #imgA, .viewer-body.swipe #imgB,
    .viewer-body.hold #imgA, .viewer-body.hold #imgB { position: absolute; max-width: 96%; max-height: 92%; }
    .viewer-body.swipe #imgB { clip-path: inset(0 0 0 var(--split, 50%)); }
    .viewer-body.hold #imgB { transition: opacity 60ms linear; }
    .viewer-body.hold.reveal #imgB { opacity: 0; }
    #vZoomHint { display: none; }
    .viewer-body.hold #vZoomHint { display: block; }
    .vdivider { position: absolute; top: 4%; bottom: 4%; left: var(--split, 50%); width: 2px; background: var(--accent-2); cursor: ew-resize; z-index: 5; }
    .vdivider::after { content: "◂▸"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: var(--accent-2); color: #000; border-radius: 50%; width: 30px; height: 30px; line-height: 30px; text-align: center; font-size: 12px; }
    .vlabel { position: absolute; top: 10px; font-size: 12px; background: #000b; padding: 3px 10px; border-radius: 6px; color: var(--text); display: none; z-index: 6; }
    .vlabel.la { left: 12px; } .vlabel.lb { right: 12px; }
    .viewer-nav {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 7;
      width: 44px; height: 64px; font-size: 26px; border: 0; border-radius: 8px;
      background: #ffffff14; color: #fff; display: none;
    }
    .viewer-nav.show { display: block; }
    #viewerPrev { left: 10px; } #viewerNext { right: 10px; }
    .vzoom { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--muted); background: #000a; padding: 3px 8px; border-radius: 6px; }
    /* tab visibility */
    body[data-tab="edit"] .t2i-only { display: none !important; }
    body[data-tab="edit"] .video-only { display: none !important; }
    body[data-tab="t2i"] .edit-only { display: none !important; }
    body[data-tab="t2i"] .video-only { display: none !important; }
    body[data-tab="video"] .edit-only { display: none !important; }
    body[data-tab="video"] .t2i-only { display: none !important; }
    body[data-tab="video"] #canvasStage { display: none; }
    body[data-tab="t2i"] #canvasStage { display: none; }
    body[data-tab="edit"] #genBanner { display: none; }
    body[data-tab="video"] #genBanner { display: none; }
    body[data-tab="edit"] #videoCard { display: none; }
    body[data-tab="t2i"] #videoCard { display: none; }
    body[data-tab="video"] #cardContent, body[data-tab="video"] #cardRef,
    body[data-tab="video"] #cardEngine, body[data-tab="video"] #cardResult,
    body[data-tab="video"] #cardParams { display: none; }
    body[data-tab="t2i"] #scopeFields { display: none; }
  </style>
</head>
<body data-tab="edit">
  <div class="app">
    <section class="stage">
      <div class="tabs">
        <button class="tab active" data-tab="edit" id="tabEdit">改图</button>
        <button class="tab" data-tab="t2i" id="tabT2i">生图</button>
        <button class="tab" data-tab="video" id="tabVideo">视频</button>
      </div>
      <div class="toolbar edit-only">
        <div class="group">
          <button class="btn" id="btnAdd">选文件</button>
          <button class="btn" id="btnAppend">追加</button>
          <button class="btn" id="btnCopyMask">复制遮罩</button>
          <button class="btn" id="btnClearList">清空列表</button>
          <input class="sr" id="fileInput" type="file" accept="image/*" multiple />
        </div>
        <div class="group">
          <button class="btn active" data-tool="brush" id="toolBrush">画笔</button>
          <button class="btn" data-tool="rect" id="toolRect">矩形</button>
          <button class="btn" data-tool="eraser" id="toolEraser">橡皮</button>
          <button class="btn" id="btnFillAll">全填</button>
          <button class="btn" id="btnClearMask">清空</button>
          <button class="btn" id="btnInvert">反选</button>
          <button class="btn" id="btnFit">适应窗口</button>
        </div>
        <div class="group">
          <span class="hint">笔刷</span>
          <input class="brush" id="brush" type="range" min="4" max="160" value="36" />
          <span class="hint" id="brushVal">36</span>
        </div>
        <div class="group">
          <span class="hint" id="imgMeta">还没有图</span>
        </div>
      </div>
      <div class="canvas-wrap" id="wrap">
        <div class="stage-banner" id="genBanner">
          <div class="big">文生图模式</div>
          <div>不需要画布——填好提示词和参数，直接点「生成图片」。<br />选图涂改请切回「改图」栏目。</div>
        </div>
        <div class="stack" id="stack">
          <canvas id="view"></canvas>
          <canvas id="paint"></canvas>
        </div>
      </div>
    </section>
    <aside class="side">
      <div>
        <h1 id="sideTitle">改图</h1>
        <div class="hint" id="sideHint">涂抹区 = 要改的区域。红色只是发给上游的标记，结果里不应出现红块。</div>
      </div>

      <div class="card edit-only" id="cardContent">
        <h2>内容图</h2>
        <div class="thumbs" id="contentThumbs"></div>
      </div>

      <div class="card edit-only" id="cardRef">
        <h2>参考图</h2>
        <div class="row">
          <button class="btn" id="btnAddRef">添加参考图</button>
          <button class="btn" id="btnClearRef">清空参考图</button>
        </div>
        <input class="sr" id="refInput" type="file" accept="image/*" multiple />
        <div class="thumbs" id="refThumbs" style="margin-top:8px"></div>
        <label>参考角色标签（可选，逗号分隔，与参考图顺序对应）</label>
        <input type="text" id="refRoles" placeholder="身份, 画法, 姿态" />
      </div>

      <div class="card edit-only" id="cardEngine">
        <h2>引擎</h2>
        <label>引擎</label>
        <select id="engine"></select>
        <div id="scopeFields">
          <label>作用域</label>
          <select id="scope">
            <option value="mask">仅遮罩区（涂红重画，不发干净原图）</option>
            <option value="full">整图重画</option>
          </select>
          <label>遮罩模式</label>
          <select id="maskMode">
            <option value="paint_edit">涂哪改哪</option>
            <option value="invert">反选：涂哪保哪</option>
          </select>
        </div>
      </div>

      <div class="card">
        <h2>接口</h2>
        <label>Base URL（到 /v1 为止，可不带 /v1 自动补）</label>
        <input type="text" id="baseUrl" placeholder="https://your-relay.example.com/v1" />
        <label>API Key（只存在本机浏览器）</label>
        <div class="key-wrap">
          <input type="password" id="apiKey" placeholder="Bearer 后面那串" autocomplete="off" />
          <button class="btn" id="toggleKey" type="button">显示</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn" id="btnTest">测试</button>
          <button class="btn" id="btnModels">获取模型列表</button>
          <button class="btn" id="btnSaveDefaults">保存为本机默认</button>
        </div>
        <div class="status" id="connStatus"></div>
      </div>

      <div class="card" id="cardParams">
        <h2>参数</h2>
        <div id="imageParams">
          <label>模型</label>
          <input type="text" id="model" list="modelList" value="gpt-image-2" />
          <label>提示词</label>
          <textarea id="prompt" placeholder="描述要改成什么样。红色标记由服务自动追加说明。"></textarea>
          <div class="row">
            <div>
              <label>清晰度</label>
              <select id="tier">
                <option value="1k">1K</option>
                <option value="2k">2K</option>
                <option value="4k">4K</option>
              </select>
            </div>
            <div>
              <label>宽高比</label>
              <select id="ratio">
                <option value="1:1">1:1</option>
                <option value="4:3">4:3</option>
                <option value="3:4">3:4</option>
                <option value="16:9">16:9</option>
                <option value="9:16">9:16</option>
                <option value="3:2">3:2</option>
                <option value="2:3">2:3</option>
              </select>
            </div>
            <div>
              <label>抽卡数量</label>
              <select id="count">
                <option value="1">1 张</option>
                <option value="2">2 张</option>
                <option value="3">3 张</option>
                <option value="4">4 张</option>
              </select>
            </div>
          </div>
          <div class="row">
            <div class="edit-only">
              <label>质量（GPT）</label>
              <select id="quality">
                <option value="high">high</option>
                <option value="medium">medium</option>
                <option value="low">low</option>
                <option value="auto">auto</option>
              </select>
            </div>
            <div>
              <label>输出格式</label>
              <select id="outputFormat">
                <option value="png">png</option>
                <option value="jpeg">jpeg</option>
                <option value="webp">webp</option>
              </select>
            </div>
          </div>
          <div class="edit-only">
            <label>适应方式</label>
            <select id="padMode">
              <option value="fit">适应（留黑边）</option>
              <option value="fill">裁切填满</option>
              <option value="stretch">拉伸</option>
            </select>
          </div>
          <div class="price" id="priceEst"></div>
          <button class="btn primary" id="btnRun" style="width:100%;margin-top:10px">提交改图</button>
          <div class="status" id="runStatus"></div>
        </div>
      </div>

      <div class="card" id="videoCard">
        <h2>视频</h2>
        <label>视频模型</label>
        <input type="text" id="vModel" list="modelList" placeholder="从中转站模型列表里选视频模型" />
        <label>提示词</label>
        <textarea id="vPrompt" placeholder="描述视频内容"></textarea>
        <div class="row">
          <div>
            <label>分辨率</label>
            <select id="vSize">
              <option value="1280x720">1280x720 横</option>
              <option value="720x1280">720x1280 竖</option>
              <option value="1024x1024">1024x1024 方</option>
              <option value="1792x1024">1792x1024 宽</option>
              <option value="1024x1792">1024x1792 高</option>
            </select>
          </div>
          <div>
            <label>时长（秒）</label>
            <select id="vSeconds">
              <option value="4">4</option>
              <option value="8" selected>8</option>
              <option value="12">12</option>
            </select>
          </div>
        </div>
        <div class="price" id="vPrice">视频价格以中转站计费为准</div>
        <button class="btn primary" id="btnRunVideo" style="width:100%;margin-top:10px">生成视频</button>
        <div class="status" id="vStatus">提交后自动轮询任务进度，一般要等几分钟。</div>
      </div>

      <div class="card result" id="cardResult">
        <h2>结果</h2>
        <img id="outImg" alt="结果会显示在这里" title="点击全屏查看 · 长按可闪看原图" />
        <div class="gallery" id="gallery"></div>
        <div class="row" style="margin-top:8px">
          <a class="btn" id="btnDownload" download="edit.png" style="text-align:center;text-decoration:none">下载</a>
          <button class="btn" id="btnCompare">按住对比</button>
          <button class="btn" id="btnSideBySide">并排看</button>
        </div>
        <div class="hint" id="outMeta"></div>
      </div>

      <div class="card result video-only" id="videoResultCard">
        <h2>视频结果</h2>
        <video id="outVideo" controls playsinline></video>
        <div class="row" style="margin-top:8px">
          <a class="btn" id="btnVideoDownload" download="video.mp4" style="text-align:center;text-decoration:none">下载视频</a>
        </div>
        <div class="hint" id="outVideoMeta">生成的视频保存在本机 outputs 目录。</div>
      </div>
    </aside>
  </div>
  <datalist id="modelList"></datalist>

  <div class="viewer" id="viewer">
    <div class="viewer-top">
      <span class="vinfo" id="viewerInfo"></span>
      <button class="btn" id="viewerMode">并排对比</button>
      <button class="btn" id="viewerClose">关闭 (Esc)</button>
    </div>
    <div class="viewer-body single" id="viewerBody">
      <span class="vlabel la" id="vLabelA">原图</span>
      <span class="vlabel lb" id="vLabelB">改后</span>
      <span class="vzoom" id="vZoomHint" style="left:auto;right:12px;bottom:12px;">按住 = 原图 · 松开 = 改后</span>
      <img id="imgA" alt="" />
      <img id="imgB" alt="" />
      <div class="vdivider" id="vDivider"></div>
      <button class="viewer-nav" id="viewerPrev">‹</button>
      <button class="viewer-nav" id="viewerNext">›</button>
      <span class="vzoom" id="vZoom">100%</span>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
